<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/MelisCore/ui-react/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Melis — Backoffice</title>
    <!-- Anti-FOUC : applique le thème avant le premier rendu.
         Priorité : ?theme=… (deep-link démo/QA) > localStorage > défaut. -->
    <script>
      (function () {
        var allowed = ['platform', 'studio']
        var theme = 'platform'
        try {
          var param = new URLSearchParams(location.search).get('theme')
          var stored = localStorage.getItem('melis-ui-theme')
          if (allowed.indexOf(param) !== -1) theme = param
          else if (allowed.indexOf(stored) !== -1) theme = stored
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <script type="module" crossorigin src="/MelisCore/ui-react/assets/index-BUQyqcOO.js"></script>

    <link rel="stylesheet" crossorigin href="/MelisCore/ui-react/assets/index-10MTZ1TK.css">
  </head>

  </body>
</html>
