<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Melis — Backoffice</title>
    <!-- Anti-FOUC : applique le thème avant le premier rendu.
         Priorité : ?theme=… (deep-link démo/QA) > localStorage > défaut. -->
    <script>
      (function () {
        var allowed = ['platform', 'studio']
        var theme = 'platform'
        try {
          var param = new URLSearchParams(location.search).get('theme')
          var stored = localStorage.getItem('melis-ui-theme')
          if (allowed.indexOf(param) !== -1) theme = param
          else if (allowed.indexOf(stored) !== -1) theme = stored
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <!-- Responsive mobile pour TOUS les champs TinyMCE (melis-core + briques des modules) :
         patch global installé avant le chargement de tinymce.min.js par n'importe quel module. -->
    <script src="/MelisCore/js/tinyMCE/melis_tinymce_mobile.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
